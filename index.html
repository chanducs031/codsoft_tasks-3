<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobBoard Pro - Advanced Job Platform</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #475569;
            --light: #f8fafc;
            --dark: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #cbd5e1;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f1f5f9;
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header Styles */
        header {
            background-color: white;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .logo i {
            font-size: 28px;
        }
        
        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }
        
        nav a {
            text-decoration: none;
            color: var(--secondary);
            font-weight: 500;
            transition: color 0.3s;
        }
        
        nav a:hover {
            color: var(--primary);
        }
        
        .auth-buttons {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 16px;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-dark);
        }
        
        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }
        
        .btn-outline:hover {
            background-color: var(--primary);
            color: white;
        }
        
        /* Main Content */
        main {
            padding: 30px 0;
        }
        
        /* Home Page */
        .hero {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 60px 0;
            border-radius: 10px;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .hero h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }
        
        .hero p {
            font-size: 20px;
            max-width: 700px;
            margin: 0 auto 30px;
        }
        
        .search-bar {
            display: flex;
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        .search-bar input {
            flex: 1;
            padding: 15px 25px;
            border: none;
            font-size: 16px;
            outline: none;
        }
        
        .search-bar button {
            padding: 15px 30px;
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        
        .search-bar button:hover {
            background-color: var(--primary-dark);
        }
        
        .featured-jobs {
            margin-top: 40px;
        }
        
        .section-title {
            font-size: 28px;
            margin-bottom: 25px;
            text-align: center;
            color: var(--dark);
        }
        
        .job-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }
        
        .job-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }
        
        .job-card:hover {
            transform: translateY(-5px);
        }
        
        .job-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .job-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--dark);
        }
        
        .company {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .company-logo {
            width: 50px;
            height: 50px;
            background-color: #e2e8f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--primary);
        }
        
        .company-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .company-info p {
            color: var(--secondary);
            font-size: 14px;
        }
        
        .job-details {
            padding: 20px;
        }
        
        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--secondary);
        }
        
        .job-description {
            margin-bottom: 20px;
            color: var(--secondary);
        }
        
        .job-actions {
            display: flex;
            justify-content: space-between;
        }
        
        .salary {
            font-weight: 700;
            color: var(--success);
        }
        
        /* Job Listings Page */
        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }
        
        .filter-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .filter-group {
            flex: 1;
        }
        
        .filter-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
        }
        
        .filter-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        /* Job Detail Page */
        .job-detail {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        .job-detail-header {
            padding: 30px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
        }
        
        .job-detail-title {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .job-detail-company {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .job-detail-logo {
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .job-detail-info h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .job-detail-info p {
            opacity: 0.9;
        }
        
        .job-detail-content {
            padding: 30px;
        }
        
        .job-detail-section {
            margin-bottom: 30px;
        }
        
        .job-detail-section h3 {
            font-size: 22px;
            margin-bottom: 15px;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            display: inline-block;
        }
        
        .job-detail-section p {
            line-height: 1.8;
            margin-bottom: 15px;
        }
        
        .job-detail-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn-large {
            padding: 15px 30px;
            font-size: 18px;
        }
        
        /* Dashboard */
        .dashboard {
            display: flex;
            gap: 30px;
        }
        
        .sidebar {
            flex: 0 0 250px;
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: var(--shadow);
            height: fit-content;
        }
        
        .sidebar h3 {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar ul {
            list-style: none;
        }
        
        .sidebar li {
            margin-bottom: 15px;
        }
        
        .sidebar a {
            text-decoration: none;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        
        .sidebar a:hover, .sidebar a.active {
            background-color: #dbeafe;
            color: var(--primary);
        }
        
        .dashboard-content {
            flex: 1;
        }
        
        .dashboard-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }
        
        .dashboard-card h3 {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
        }
        
        .form-group textarea {
            min-height: 150px;
        }
        
        .applications-list {
            display: grid;
            gap: 20px;
        }
        
        .application-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .application-info h4 {
            margin-bottom: 5px;
        }
        
        .application-info p {
            color: var(--secondary);
        }
        
        .application-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 500;
        }
        
        .status-pending {
            background-color: #fef3c7;
            color: #92400e;
        }
        
        .status-approved {
            background-color: #d1fae5;
            color: #065f46;
        }
        
        .status-rejected {
            background-color: #fee2e2;
            color: #991b1b;
        }
        
        /* Application Form */
        .application-form {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: var(--shadow);
        }
        
        .file-upload {
            border: 2px dashed var(--border);
            border-radius: 6px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        .file-upload:hover {
            border-color: var(--primary);
        }
        
        .file-upload i {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        /* Footer */
        footer {
            background-color: var(--dark);
            color: white;
            padding: 50px 0 20px;
            margin-top: 50px;
        }
        
        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .footer-column h3 {
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .footer-column ul {
            list-style: none;
        }
        
        .footer-column ul li {
            margin-bottom: 12px;
        }
        
        .footer-column a {
            color: #cbd5e1;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .footer-column a:hover {
            color: white;
        }
        
        .copyright {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #334155;
            color: #94a3b8;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .dashboard {
                flex-direction: column;
            }
            
            .sidebar {
                flex: 0 0 auto;
            }
            
            .job-grid {
                grid-template-columns: 1fr;
            }
            
            .filter-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Mock data for our job board
        const mockJobs = [
            {
                id: 1,
                title: "Senior Frontend Developer",
                company: "Tech Innovations Inc.",
                location: "San Francisco, CA",
                type: "Full-time",
                salary: "$120,000 - $150,000",
                experience: "5+ years",
                posted: "2 days ago",
                description: "We are looking for an experienced Frontend Developer to join our team. You will be responsible for building user interfaces using React and modern web technologies.",
                requirements: [
                    "5+ years of experience with React",

                ],
                responsibilities: [
                    "Develop new user-facing features",

                    "Implement responsive design on mobile platforms"
                ]
            },
            {
                id: 2,
                title: "UX/UI Designer",
                company: "Creative Solutions",
                location: "New York, NY",
                type: "Full-time",
                salary: "$90,000 - $110,000",
                experience: "3+ years",
                posted: "1 week ago",
                description: "Join our design team to create beautiful and functional user experiences for our web and mobile applications.",
                requirements: [
                    "3+ years of UX/UI design experience",
                    "Proficiency in design tools (Figma, Sketch, Adobe XD)",
                    "Strong portfolio showcasing design process",
                    "Understanding of user-centered design principles",
                    "Experience with prototyping and user testing"
                ],
                responsibilities: [
                    "Create wireframes, prototypes, and high-fidelity designs",
                    "Conduct user research and usability testing",
                    "Collaborate with product managers and developers",
                    "Develop design systems and style guides",
                    "Present design concepts to stakeholders"
                ]
            },
            {
                id: 3,
                title: "Data Scientist",
                company: "Data Insights Co.",
                location: "Remote",
                type: "Full-time",
                salary: "$130,000 - $160,000",
                experience: "4+ years",
                posted: "3 days ago",
                description: "We're seeking a Data Scientist to analyze complex datasets and build predictive models to drive business decisions.",
                requirements: [
                    "4+ years of experience in data science",
                    "Proficiency in Python, R, or SQL",
                    "Experience with machine learning frameworks",
                    "Strong statistical analysis skills",
                    "Knowledge of data visualization tools"
                ],
                responsibilities: [
                    "Analyze large, complex datasets to find trends",
                    "Build and implement machine learning models",
                    "Create data visualizations and reports",
                    "Collaborate with cross-functional teams",
                    "Present findings to stakeholders"
                ]
            },
            {
                id: 4,
                title: "DevOps Engineer",
                company: "Cloud Systems Ltd.",
                location: "Austin, TX",
                type: "Full-time",
                salary: "$110,000 - $140,000",
                experience: "4+ years",
                posted: "5 days ago",
                description: "Looking for a DevOps Engineer to manage our cloud infrastructure and CI/CD pipelines.",
                requirements: [
                    "4+ years of DevOps experience",
                    "Experience with AWS, Azure, or GCP",
                    "Knowledge of Docker and Kubernetes",
                    "Familiarity with CI/CD tools (Jenkins, GitLab)",
                    "Scripting skills (Python, Bash)"
                ],
                responsibilities: [
                    "Design and maintain cloud infrastructure",
                    "Implement and manage CI/CD pipelines",
                    "Monitor system performance and reliability",
                    "Automate deployment processes",
                    "Ensure security and compliance"
                ]
            },
            {
                id: 5,
                title: "Product Manager",
                company: "InnovateX",
                location: "Seattle, WA",
                type: "Full-time",
                salary: "$125,000 - $155,000",
                experience: "5+ years",
                posted: "1 week ago",
                description: "Join our product team to drive the development of innovative software solutions.",
                requirements: [
                    "5+ years of product management experience",
                    "Experience with Agile methodologies",
                    "Strong analytical and problem-solving skills",
                    "Excellent communication and leadership abilities",
                    "Technical background preferred"
                ],
                responsibilities: [
                    "Define product vision and roadmap",
                    "Gather and prioritize product requirements",
                    "Work closely with engineering and design teams",
                    "Analyze market trends and competitor products",
                    "Track product performance metrics"
                ]
            },
            {
                id: 6,
                title: "Marketing Specialist",
                company: "Growth Partners",
                location: "Chicago, IL",
                type: "Full-time",
                salary: "$70,000 - $85,000",
                experience: "2+ years",
                posted: "4 days ago",
                description: "We're looking for a creative Marketing Specialist to help promote our services and grow our customer base.",
                requirements: [
                    "2+ years of marketing experience",
                    "Experience with digital marketing channels",
                    "Strong written and verbal communication skills",
                    "Familiarity with marketing automation tools",
                    "Knowledge of analytics platforms"
                ],
                responsibilities: [
                    "Develop and execute marketing campaigns",
                    "Create content for social media and email",
                    "Analyze campaign performance and metrics",
                    "Collaborate with sales and design teams",
                    "Manage marketing budget and resources"
                ]
            }
        ];

        // Mock user data
        const mockUsers = [
            {
                id: 1,
                name: "John Doe",
                email: "john@example.com",
                role: "candidate",
                profile: {
                    title: "Senior Frontend Developer",
                    experience: "5 years",
                    skills: ["React", "JavaScript", "HTML", "CSS"],
                    resume: "john_doe_resume.pdf"
                }
            },
            {
                id: 2,
                name: "Jane Smith",
                email: "jane@company.com",
                role: "employer",
                company: "Tech Innovations Inc."
            }
        ];

        // Mock applications
        const mockApplications = [
            {
                id: 1,
                jobId: 1,
                candidateId: 1,
                status: "pending",
                appliedDate: "2023-05-15"
            }
        ];

        // Main App Component
        function App() {
            const [currentPage, setCurrentPage] = React.useState('home');
            const [user, setUser] = React.useState(null);
            const [jobs, setJobs] = React.useState(mockJobs);
            const [selectedJob, setSelectedJob] = React.useState(null);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filters, setFilters] = React.useState({
                location: '',
                type: '',
                experience: ''
            });
            const [applications, setApplications] = React.useState(mockApplications);

            // Filter jobs based on search and filters
            const filteredJobs = jobs.filter(job => {
                const matchesSearch = job.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                     job.company.toLowerCase().includes(searchTerm.toLowerCase());
                
                const matchesLocation = filters.location ? job.location.includes(filters.location) : true;
                const matchesType = filters.type ? job.type === filters.type : true;
                const matchesExperience = filters.experience ? job.experience.includes(filters.experience) : true;
                
                return matchesSearch && matchesLocation && matchesType && matchesExperience;
            });

            // Handle login
            const handleLogin = (email, password) => {
                const foundUser = mockUsers.find(u => u.email === email);
                if (foundUser) {
                    setUser(foundUser);
                    return true;
                }
                return false;
            };

            // Handle logout
            const handleLogout = () => {
                setUser(null);
                setCurrentPage('home');
            };

            // Apply for a job
            const applyForJob = (jobId) => {
                if (!user) {
                    alert("Please log in to apply for jobs");
                    setCurrentPage('login');
                    return;
                }
                
                const newApplication = {
                    id: applications.length + 1,
                    jobId: jobId,
                    candidateId: user.id,
                    status: "pending",
                    appliedDate: new Date().toISOString().split('T')[0]
                };
                
                setApplications([...applications, newApplication]);
                alert("Application submitted successfully!");
            };

            // Post a new job
            const postJob = (jobData) => {
                const newJob = {
                    id: jobs.length + 1,
                    ...jobData,
                    posted: "Just now"
                };
                setJobs([...jobs, newJob]);
                alert("Job posted successfully!");
            };

            // Render current page
            const renderPage = () => {
                switch (currentPage) {
                    case 'home':
                        return <HomePage 
                            jobs={filteredJobs.slice(0, 3)} 
                            onSearch={setSearchTerm}
                            onViewJob={(job) => {
                                setSelectedJob(job);
                                setCurrentPage('job-detail');
                            }}
                        />;
                    case 'jobs':
                        return <JobsPage 
                            jobs={filteredJobs} 
                            onViewJob={(job) => {
                                setSelectedJob(job);
                                setCurrentPage('job-detail');
                            }}
                            filters={filters}
                            setFilters={setFilters}
                        />;
                    case 'job-detail':
                        return <JobDetailPage 
                            job={selectedJob} 
                            onApply={applyForJob}
                            onBack={() => setCurrentPage('jobs')}
                        />;
                    case 'employer-dashboard':
                        return <EmployerDashboard 
                            jobs={jobs.filter(j => j.company === "Tech Innovations Inc.")}
                            onPostJob={postJob}
                        />;
                    case 'candidate-dashboard':
                        return <CandidateDashboard 
                            applications={applications.filter(a => a.candidateId === 1)}
                        />;
                    case 'apply':
                        return <ApplicationForm 
                            job={selectedJob}
                            onSubmit={() => {
                                applyForJob(selectedJob.id);
                                setCurrentPage('jobs');
                            }}
                        />;
                    case 'login':
                        return <LoginForm onLogin={handleLogin} />;
                    case 'register':
                        return <RegisterForm />;
                    default:
                        return <HomePage 
                            jobs={filteredJobs.slice(0, 3)} 
                            onSearch={setSearchTerm}
                            onViewJob={(job) => {
                                setSelectedJob(job);
                                setCurrentPage('job-detail');
                            }}
                        />;
                }
            };

            return (
                <div>
                    <Header 
                        user={user} 
                        onLogin={() => setCurrentPage('login')}
                        onRegister={() => setCurrentPage('register')}
                        onLogout={handleLogout}
                        onPageChange={setCurrentPage}
                    />
                    <main className="container">
                        {renderPage()}
                    </main>
                    <Footer />
                </div>
            );
        }

        // Header Component
        function Header({ user, onLogin, onRegister, onLogout, onPageChange }) {
            return (
                <header>
                    <div className="container">
                        <div className="header-content">
                            <div className="logo" onClick={() => onPageChange('home')}>
